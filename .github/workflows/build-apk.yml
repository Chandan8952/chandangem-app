name: Build Standalone APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ChandanGem Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChandanGem-Standalone-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-standalone
          name: "ChandanGem v1.0.1 (Separate Standalone App)"
          body: |
            ## ChandanGem Standalone Android App
            * **Application ID**: `com.chandankumar.chandangem.debug`
            * **Owner**: Chandan Kumar
            * **Features**: Full-Duplex Voice Assistant, Jetpack Compose UI, MCP Protocol Client, Termux Terminal Engine.
            * **Installation**: Installs completely side-by-side with AntiGem without any conflicts.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
